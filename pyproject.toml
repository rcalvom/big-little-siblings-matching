[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "csap-siblings-match"
version = "0.3.0"
description = "Transparent, capacity-aware matching for the CSAP Big-Little Siblings Program"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.4,<4",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
csap-siblings-match = "csap_siblings_match.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["csap_siblings_match*"]

[tool.setuptools.package-data]
"csap_siblings_match.policies" = ["*.yaml"]
